{% extends "base.html" %}

{% block title %}404 Not Found - ScamShield AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; text-align: center; padding: 60px 0;">
  <div style="font-size: 4rem; font-weight: 800; color: var(--cyan-light); line-height: 1;">404</div>
  <h1 style="font-size: 1.5rem; margin: 16px 0 8px;">Resource Not Found</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
    The requested scan, document, or route does not exist or has been removed.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
